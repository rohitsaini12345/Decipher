<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
</head>
<body>

<h2>Edit Profile</h2>

<form th:action="@{/user/update}" method="post" th:object="${user}">
    <input type="hidden" th:field="*{id}" />

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br/>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required /><br/>

    <label>Password:</label>
    <input type="password" th:field="*{password}" required /><br/>
	
	<label>Role:</label>
	<input type="text" th:field="*{role}" required /><br/>

    <button type="submit">Update</button>
</form>

</body>
</html>
