<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
        }

        form {
            width: 300px;
            margin: 0 auto;
        }

        label {
            display: inline-block;
            width: 100px;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 5px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }
    </style>

</head>
<body>
    <h2 style="text-align: center;">Login</h2>
    <form th:action="@{/login}" method="post">
		
        <label>Email:</label>
        <input type="text" name="username" required /><br/>
		
        <label>Password:</label>
        <input type="password" name="password" required /><br/>
		
        <button type="submit">Login</button>
    </form>
	
    <p style="text-align: center;">Don't have an account? <a th:href="@{/register}">Register here</a></p>

    <p th:if="${param.error}" style="text-align: center; color:red ">Invalid username or password</p>
    <p th:if="${param.logout}" style="text-align: center; color:red">You have been logged out.</p>
    <p th:if="${param.deleted}" style="text-align: center; color:red;">Your account has been deleted.</p>

</body>
</html>
