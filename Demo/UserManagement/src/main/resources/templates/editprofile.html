<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
        }

        form {
            width: 300px;
            margin: 0 auto;
        }

        label {
            display: inline-block;
            width: 100px;
            margin-bottom: 10px;
        }
        label[for="male"] {
            width: 50px;
        }
        label[for="female"] {
            width: 50px;
        }

        input {
            width: 100%;
            padding: 5px;
            margin-bottom: 15px;
        }
        input[type="radio"] {
            width: 20px;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">Edit-Profile</h2>

<form th:action="@{/user/update}" method="post" th:object="${user}" enctype="multipart/form-data">
    <input type="hidden" th:field="*{id}" />

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br/>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required readonly/><br/>

    <label>Password:</label>
    <input type="password" th:field="*{password}" required /><br/>

    <label>Gender:</label>
    <input type="radio" id="male" th:field="*{gender}" value="Male" required />
    <label for="male">Male</label>
    <input type="radio" id="female" th:field="*{gender}" value="Female" required />
    <label for="female">Female</label><br/>

    <label>Phone:</label>
    <input type ="number" th:field="*{phone}" required/><br/>

    <label>Address:</label>
    <input type="text" th:field="*{address}" required/><br/>

    <label>Role:</label>
    <input type="text" th:field="*{role}" required /><br/>

    <label>Profile Image:</label>
    <input type="file" name="image" /><br/>

    <button type="submit">Update</button>
</form>



</body>
</html>
