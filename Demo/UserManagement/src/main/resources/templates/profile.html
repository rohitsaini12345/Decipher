<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>

</head>
<body>
    <h2>User Profile</h2>

    <img th:if="${user.profileImage != null}"
         th:src="@{'/images/' + ${user.profileImage}}"
         alt="Profile Image"
         style="width: 100px; height:100px" />

    <p><strong>Id:</strong> <span th:text="${user.id}"></span></p>

    <p><strong>Name:</strong> <span th:text="${user.Name}"></span></p>
   
    <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>

    <p><strong>Role:</strong> <span th:text="${user.role}"></span></p>

    <form th:action="@{'/user/edit/' + ${user.id}}"method="get" style="display: inline;">
        <button type="submit" >Edit</button>
    </form>

    |

    <form th:action="@{'/user/delete/' + ${user.id}}" method="post" style="display: inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit"  onclick="return confirm('Are you sure you want to delete this user?')">Delete</button>
    </form>

    |

    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="logout-link">Logout</button>
    </form>
	
</body>
</html>
