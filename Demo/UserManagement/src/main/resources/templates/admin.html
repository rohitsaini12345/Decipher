<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" >
<head>
    <title>Admin Dashboard</title>
</head>
<body>
    <h2>Admin Dashboard</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Gender</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.gender}"></td>
                <td th:text="${user.phone}"></td>
                <td th:text="${user.address}"></td>
                <td th:text="${user.role}"></td>
                <td>
                    <form th:action="@{'/user/edit/' + ${user.id}}"method="get" style="display: inline;">
                        <button type="submit" >Edit</button>
                    </form>

                    |

                    <form th:action="@{'/user/delete/' + ${user.id}}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this user?')">Delete</button>
                    </form>

                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <form th:action="@{/import-users}" method="post" enctype="multipart/form-data" >
        <input type="file" name="file" accept=".xlsx">
        <button type="submit">Import Users</button>
    </form>

    <br>

    <form th:action="@{/export-users}" method="get">
        <button type="submit">Export Users</button>
    </form>

    <br>

    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="logout-link">Logout</button>
    </form>

</body>
</html>
